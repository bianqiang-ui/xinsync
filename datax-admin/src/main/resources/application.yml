# web port
server:
  # 不能写成 ${server.port:...}（同名自引用会 Circular placeholder reference）；值须与 bin/env.properties 的 SERVER_PORT 一致
  port: 9527
spring:
  #数据源
  datasource:
    #    username: root
    #password: root
    #url: jdbc:mysql://localhost:3306/datax_web?serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false&useSSL=false&nullNamePatternMatchesAll=true&useUnicode=true&characterEncoding=UTF-8
    password: ${DB_PASSWORD:password}
    username: ${DB_USERNAME:username}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:dataxweb}?serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false&useSSL=false&nullNamePatternMatchesAll=true&useUnicode=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver


    hikari:
      ## 最小空闲连接数量
      minimum-idle: 5
      ## 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 180000
      ## 连接池最大连接数，默认是10
      maximum-pool-size: 10
      ## 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      ##此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      max-lifetime: 1800000

  # datax-web email
  mail:
    host: smtp.qq.com
    port: 25
    #username: xxx@qq.com
    #password: xxx
    username: ${mail.username:}
    password: ${mail.password:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        socketFactory:
          class: javax.net.ssl.SSLSocketFactory


management:
  health:
    mail:
      enabled: false
  server:
    servlet:
      context-path: /actuator

mybatis-plus:
  # mapper.xml文件扫描
  mapper-locations: classpath*:/mybatis-mapper/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  #typeAliasesPackage: com.yibo.essyncclient.*.entity
  global-config:
    # 数据库相关配置
    db-config:
      # 主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      # 字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
      field-strategy: NOT_NULL
      # 驼峰下划线转换
      column-underline: true
      # 逻辑删除
      logic-delete-value: 0
      logic-not-delete-value: 1
      # 数据库类型
      db-type: mysql
    banner: false
  # mybatis原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    type-handlers-package: com.wugui.datax.admin.core.handler

# 配置mybatis-plus打印sql日志
logging:
  config: classpath:logback.xml
  #level:
  #  com.wugui.datax.admin.mapper: info
  #path: ./data/applogs/admin
  level:
    com.wugui.datax.admin.mapper: error
  path: ${data.path:./data}/applogs/admin



#datax-job, access token
datax:
  job:
    # SECURITY: never leave empty in production; set DATAX_ACCESS_TOKEN env or override via properties.
    # An empty token means /api/callback|registry|processCallback are effectively UNAUTHENTICATED.
    accessToken: ${DATAX_ACCESS_TOKEN:}
    # 兼容旧部署：仅在设为 true 时，accessToken 为空的回调才允许匿名通过
    allowEmptyAccessToken: ${DATAX_ALLOW_EMPTY_ACCESS_TOKEN:false}
    #i18n (default empty as chinese, "en" as english)
    i18n:
    ## triggerpool max size
    triggerpool:
      fast:
        max: 200
      slow:
        max: 100
      ### log retention days
    logretentiondays: 30

  # admin 侧安全策略
  security:
    # 允许跨域访问接口的前端来源，多个用逗号分隔；保持 "*" 时不会下发 allow-credentials
    corsAllowedOrigins: ${DATAX_CORS_ALLOWED_ORIGINS:*}
    # 是否匿名开放 swagger 文档（doc.html）；生产环境保持 false
    swaggerAnonymous: ${DATAX_SWAGGER_ANONYMOUS:false}

  # JWT 登录令牌签名密钥
  jwt:
    # SECURITY: 生产环境必须设置 DATAX_JWT_SECRET（>=32 位随机串）。
    # 未设置时进程启动会随机生成密钥，重启后所有已签发 token 失效，多实例部署务必配置为统一值。
    secret: ${DATAX_JWT_SECRET:}

datasource:
  aes:
    # 数据源账号密码的落库加密密钥；发行版默认值 AD42F6697B035B75 会被启动日志判定为不安全并要求替换
    # 注意：换 key 之前用旧 key 加密入库的数据源密码将无法解密，必须在新 key 下重新录入数据源
    key: ${DATAX_AES_KEY:AD42F6697B035B75}