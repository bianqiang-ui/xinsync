# web port
server:
  # 不要写成 ${server.port:...}（同名自引用会 Circular placeholder reference）；
  # 这里是"脱离启动脚本裸跑"时的兜底，打包部署由 env.properties 的 SERVER_PORT=9504 经 -Dserver.port 覆盖
  port: 9504

# log config
logging:
  config: classpath:logback.xml
  path: ${data.path:./data}/applogs/executor/jobhandler
  #path: ./data/applogs/executor/jobhandler

datax:
  job:
    admin:
      ### datax admin address list, such as "http://address" or "http://address01,http://address02"
      #addresses: http://127.0.0.1:9527
      # 9527 = admin 默认端口（doc/datax-web/datax-web-deploy.md）；打包部署时启动脚本以
      # -Ddatax.admin.port 覆盖（env.properties 的 DATAX_ADMIN_PORT 出厂为空，走脚本兜底 9527）
      addresses: http://127.0.0.1:${datax.admin.port:9527}
    executor:
      appname: datax-executor
      ip:
      #port: 9999
      port: ${executor.port:9999}
      ### job log path
      #logpath: ./data/applogs/executor/jobhandler
      logpath: ${data.path:./data}/applogs/executor/jobhandler
      ### job log retention days
      logretentiondays: 30
    ### job, access token
    # SECURITY: 生产环境必须与 admin 侧 DATAX_ACCESS_TOKEN 保持一致；留空时 executor 的 RPC 端口会拒绝所有请求
    accessToken: ${DATAX_ACCESS_TOKEN:}
    # 兼容旧部署：设为 true 才允许 accessToken 为空的匿名调用
    allowEmptyAccessToken: ${DATAX_ALLOW_EMPTY_ACCESS_TOKEN:false}

  executor:
    #jsonpath: D:\\temp\\executor\\json\\
    jsonpath: ${json.path:./data/json}
    # python 解释器，Windows 一般保持 python，Linux 可改为 python3 或绝对路径
    # 启动脚本里的 PYTHON_BIN / -Ddatax.executor.python 优先级高于此处
    python: python

  #pypath: F:\tools\datax\bin\datax.py
  pypath: ${python.path:}